name: Prüfen

# Prüft jeden Push auf einem Arbeitszweig, ohne etwas zu veröffentlichen:
# Formatprüfung, Tests, Svelte-Typprüfung und Web-Build. Gedacht für Sitzungen,
# die selbst kein PyPI und kein npm erreichen — hier läuft, was dort fehlt.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python-Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Formatprüfung
        run: python camper.py check

      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-Abhängigkeiten installieren
        working-directory: web
        run: npm ci

      - name: Typprüfung
        working-directory: web
        run: npm run check

      - name: Web bauen
        working-directory: web
        run: npm run build
