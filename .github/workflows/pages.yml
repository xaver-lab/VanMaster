name: Pages

# Baut das neue Web-Dashboard (web/) mit den aktuellen Vault-Daten und liefert
# es rein lesend über GitHub Pages aus (UMBAU.md Phase 9). Das alte Dashboard
# unter docs/ bleibt vorerst unberührt im Repo, hier nicht gebaut.

on:
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "data/**"
      - "web/**"
      - "tools/**"
      - "camper.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Python-Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-Abhängigkeiten installieren
        working-directory: web
        run: npm ci

      - name: Web bauen
        working-directory: web
        run: npm run build

      - name: Daten und Medien nach web/dist schreiben
        run: python camper.py web daten

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
